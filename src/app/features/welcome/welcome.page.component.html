<main class="land">
  <app-statement-tile class="slot slot--a" aria-hidden="true" />
  <app-illustration-tile class="slot slot--b" aria-hidden="true" />
  <app-totp-tile class="slot slot--c" aria-hidden="true" />
  <app-checkup-tile class="slot slot--e" aria-hidden="true" />

  <app-hero-tile
    class="slot slot--hero"
    (createAccount)="open('register')"
    (signIn)="open('login')"
  />

  <app-vault-tile class="slot slot--d" />
  <app-generator-tile class="slot slot--g" />
  <app-autofill-tile class="slot slot--h" aria-hidden="true" />
  <app-logo-tile class="slot slot--i" aria-hidden="true" />
</main>

@if (view() === 'login' || view() === 'register') {
  <app-modal (onCancel)="close()">
    @if (view() === 'login') {
      <app-login (createAccount)="view.set('register')" />
    }

    @if (view() === 'register') {
      <app-register (signIn)="view.set('login')" />
    }
  </app-modal>
}
