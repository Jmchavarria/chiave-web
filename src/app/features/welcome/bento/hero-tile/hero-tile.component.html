<app-bento-tile variant="strong" padding="38px" [interactive]="false">
  <section class="hero" aria-labelledby="hero-title">
    <svg class="hero__rings" width="420" height="420" viewBox="0 0 420 420" fill="none" aria-hidden="true">
      <circle cx="210" cy="210" r="205" stroke="rgba(255,255,255,0.07)" />
      <circle cx="210" cy="210" r="150" stroke="rgba(255,255,255,0.07)" />
      <circle cx="210" cy="210" r="95" stroke="rgba(255,255,255,0.07)" />
      <circle cx="210" cy="210" r="40" stroke="rgba(221,227,146,0.45)" />
      <circle cx="337" cy="85" r="6" fill="#DDE392" />
    </svg>

    <span class="k">Password manager</span>

    <div class="hero__body">
      <h1 id="hero-title" class="th hero__title">Every password, safe and private.</h1>
      <p class="hero__text">Create an account or sign in to open your vault.</p>
      <div class="hero__cta">
        <button class="chv-btn" type="button" (click)="createAccount.emit()">Create account</button>
        <button class="chv-btn chv-btn--ghost" type="button" (click)="signIn.emit()">Sign in</button>
      </div>
    </div>
  </section>
</app-bento-tile>
